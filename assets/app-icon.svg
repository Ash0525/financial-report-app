<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Financial Report App icon</title>
  <desc id="description">
    A white financial report with a green rising chart on a blue background.
  </desc>

  <defs>
    <linearGradient id="background" x1="160" y1="96" x2="864" y2="928">
      <stop offset="0" stop-color="hsl(221, 83%, 59%)" />
      <stop offset="1" stop-color="hsl(224, 76%, 38%)" />
    </linearGradient>

    <linearGradient id="chart" x1="320" y1="700" x2="730" y2="420">
      <stop offset="0" stop-color="hsl(154, 70%, 38%)" />
      <stop offset="1" stop-color="hsl(145, 72%, 50%)" />
    </linearGradient>

    <filter id="paper-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow
        dx="0"
        dy="28"
        stdDeviation="28"
        flood-color="hsl(222, 47%, 11%)"
        flood-opacity="0.28"
      />
    </filter>
  </defs>

  <!-- macOS-style rounded tile -->
  <rect
    x="48"
    y="48"
    width="928"
    height="928"
    rx="216"
    fill="url(#background)"
  />

  <!-- Subtle highlight gives the blue tile depth. -->
  <path
    d="M264 88h496c104 0 188 84 188 188v64C790 228 564 190 88 374v-98C88 172 172 88 264 88Z"
    fill="hsl(0, 0%, 100%)"
    opacity="0.08"
  />

  <!-- Report page -->
  <g filter="url(#paper-shadow)">
    <path
      d="M286 204h324l144 144v432c0 35-29 64-64 64H286c-35 0-64-29-64-64V268c0-35 29-64 64-64Z"
      fill="hsl(0, 0%, 100%)"
    />

    <!-- Folded page corner -->
    <path
      d="M610 204v112c0 18 14 32 32 32h112Z"
      fill="hsl(214, 47%, 91%)"
    />

    <!-- Report heading and text lines -->
    <rect
      x="304"
      y="316"
      width="218"
      height="42"
      rx="21"
      fill="hsl(221, 83%, 53%)"
    />
    <rect
      x="304"
      y="400"
      width="348"
      height="24"
      rx="12"
      fill="hsl(214, 32%, 86%)"
    />
    <rect
      x="304"
      y="452"
      width="278"
      height="24"
      rx="12"
      fill="hsl(214, 32%, 86%)"
    />

    <!-- Rising financial chart -->
    <path
      d="M316 704 420 618l96 42 152-166"
      fill="none"
      stroke="url(#chart)"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="42"
    />
    <circle cx="316" cy="704" r="26" fill="hsl(154, 70%, 38%)" />
    <circle cx="420" cy="618" r="26" fill="hsl(151, 71%, 41%)" />
    <circle cx="516" cy="660" r="26" fill="hsl(149, 72%, 44%)" />
    <circle cx="668" cy="494" r="26" fill="hsl(145, 72%, 50%)" />

    <!-- Arrowhead -->
    <path
      d="m610 490 75-14-13 76"
      fill="none"
      stroke="hsl(145, 72%, 50%)"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="34"
    />
  </g>
</svg>
