<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial App</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <h1>Financial Reports</h1>
        <p>Your frontend is connected.</p>

        <section aria-labelledby="reports-heading">
            <h2 id="reports-heading"> Saved reports</h2>
            <p id="reports-status">Loading reports...</p>
            <ul id="reports-list"></ul>
        </section>

        <!-- Save reports -->
        <section aria-labelledby="create-report-heading">
            <h2 id="create-report-heading">Create a report</h2>

            <form id="report-form">
                <div>
                    <label for="report-title">Title</label>
                    <input
                        id="report-title"
                        name="title"
                        type="text"
                        maxlength="200"
                        required
                    >
                </div>

                <div>
                    <label for="period-start">Start date</label>
                    <input
                        id="period-start"
                        name="reporting-period_start"
                        type="date"
                        required
                    >
                </div>

                <div>
                    <label for="period-end">End date</label>
                    <input
                        id="period-end"
                        name="reporting_period_end"
                        type="date"
                        required
                    >
                </div>

                <fieldset>
                    <legend>Income</legend>

                    <div id="income-items"></div>

                    <button id="add-income" type="button">
                        Add income
                    </button>
                </fieldset>

                <fieldset>
                    <legend>Expenses</legend>

                    <div id="expense-items"></div>

                    <button id="add-expense" type="button">
                        Add expense
                    </button>
                </fieldset>

                <div>
                    <label for="report-notes">Notes</label>
                    <textarea
                        id="report-notes"
                        name="notes"
                        rows="4"
                    ></textarea>
                </div>

                <button type="submit">Save report</button>
                <p id="form-status" role="status"></p>
            </form>

            <template id="line-item-template">
                <div class="line-item">
                    <label>
                        Description
                        <input
                            class="line-item-description"
                            type="text"
                            maxlength="200"
                            required
                        >
                    </label>

                    <label>
                        Amount
                        <input
                            class="line-item-amount"
                            type="number"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </label>

                    <button
                        class="remove-line-item"
                        type="button"
                    >
                        Remove
                    </button>
                </div>
            </template>
        </section>

        <!-- Add details -->
         <section id="report-details" aria-labelledby="details-title" hidden>

            <h2 id="details-title"></h2>
            <p id="details-period"></p>

            <h3>Income</h3>
            <ul id="details-income"></ul>
            <p id="income-total"></p>

            <h3>Expenses</h3>
            <ul id="details-expenses"></ul>
            <p id="expense-total"></p>

            <h3>Notes</h3>
            <p id="details-notes"></p>

            <button id="close-details" type="button">
                Close details
            </button>
            
         </section>

    </main>

    <script src="/app.js?v=5"></script>
</body>
</html>
