<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Create, review, and export personal financial reports."
    >
    <title>Financial Reports</title>
    <link rel="stylesheet" href="/style.css?v=2">
</head>
<body>
    <main>
        <!-- Page header and saved-reports panel trigger -->
        <header class="page-header">
            <div>
                <h1>Financial Reports</h1>
                <p>Create, review, and export your financial reports.</p>
            </div>

            <button
                id="open-reports"
                type="button"
                aria-controls="saved-reports-panel"
                aria-expanded="false"
            >
                Saved reports
            </button>
        </header>

        <!-- Backdrop shown behind the saved-reports side panel -->
        <div id="reports-backdrop" class="panel-backdrop" hidden></div>

        <!-- Saved-reports side panel -->
        <aside
            id="saved-reports-panel"
            class="saved-reports-panel"
            role="dialog"
            aria-labelledby="reports-heading"
            aria-modal="true"
            aria-hidden="true"
        >
            <div class="panel-header">
                <div>
                    <h2 id="reports-heading">Saved reports</h2>
                    <p>Choose a report to view its full details.</p>
                </div>

                <button
                    id="close-reports"
                    class="icon-button"
                    type="button"
                    aria-label="Close saved reports"
                >
                    &times;
                </button>
            </div>

            <p id="reports-status" role="status">Loading reports…</p>
            <ul id="reports-list"></ul>

            <!-- Destructive saved-report actions -->
            <div class="panel-footer">
                <button
                    id="delete-all-reports"
                    class="danger-button"
                    type="button"
                    disabled
                >
                    Delete all reports
                </button>
            </div>
        </aside>

        <!-- Create-report form -->
        <section aria-labelledby="create-report-heading">
            <h2 id="create-report-heading">Create a report</h2>

            <form id="report-form">
                <div>
                    <label for="report-title">Title</label>
                    <input
                        id="report-title"
                        name="title"
                        type="text"
                        maxlength="200"
                        required
                    >
                </div>

                <div class="date-fields">
                    <div>
                        <label for="period-start">Start date</label>
                        <input
                            id="period-start"
                            name="reporting_period_start"
                            type="date"
                            required
                        >
                    </div>

                    <div>
                        <label for="period-end">End date</label>
                        <input
                            id="period-end"
                            name="reporting_period_end"
                            type="date"
                            required
                        >
                    </div>
                </div>

                <fieldset>
                    <legend>Income</legend>

                    <div id="income-items"></div>

                    <button id="add-income" type="button">
                        Add income
                    </button>
                </fieldset>

                <fieldset>
                    <legend>Expenses</legend>

                    <div id="expense-items"></div>

                    <button id="add-expense" type="button">
                        Add expense
                    </button>
                </fieldset>

                <div>
                    <label for="report-notes">Notes</label>
                    <textarea
                        id="report-notes"
                        name="notes"
                        rows="4"
                        maxlength="5000"
                    ></textarea>
                </div>
                
                <!-- Div element with submit and cancel edit buttons -->
                <div class="form-actions">

                    <!-- Submit report-->
                    <button id="submit-report" type="submit">
                        Save report
                    </button>
                    
                    <!-- Cancel edit -->
                    <button id="cancel-edit" type="button" hidden>
                        Cancel editing
                    </button>
                </div>

                <p id="form-status" role="status" aria-live="polite"></p>
            </form>

            <!-- Reusable income and expense row template -->
            <template id="line-item-template">
                <div class="line-item">
                    <label>
                        Description
                        <input
                            class="line-item-description"
                            type="text"
                            maxlength="200"
                            required
                        >
                    </label>

                    <label>
                        Amount
                        <input
                            class="line-item-amount"
                            type="number"
                            min="0.01"
                            step="0.01"
                            inputmode="decimal"
                            required
                        >
                    </label>

                    <button
                        class="remove-line-item"
                        type="button"
                    >
                        Remove
                    </button>
                </div>
            </template>
        </section>

        <!-- Selected-report details and PDF download -->
        <section id="report-details" aria-labelledby="details-title" hidden>
            <h2 id="details-title"></h2>
            <p id="details-period"></p>

            <h3>Income</h3>
            <ul id="details-income"></ul>
            <p id="income-total"></p>

            <h3>Expenses</h3>
            <ul id="details-expenses"></ul>
            <p id="expense-total"></p>

            <p id="net-balance"></p>

            <h3>Notes</h3>
            <p id="details-notes"></p>

            <div class="details-actions">
                <!-- Edit report button -->
                <button id="edit-report" type="button">
                    Edit report
                </button>

                <!-- Download pdf button -->
                <a id="download-pdf" href="#">Download PDF</a>

                <!-- Close button -->
                <button id="close-details" type="button">
                    Close details
                </button>
            </div>
        </section>
    </main>

    <!-- Frontend application behavior -->
    <script src="/app.js?v=9"></script>
</body>
</html>
